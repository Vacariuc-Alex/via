<svg xmlns="http://www.w3.org/2000/svg"
     width="20" height="20"
     viewBox="8 8 104 104"
     role="img" aria-label="Default technology icon">

    <!-- Background -->
    <rect x="8" y="8" width="104" height="104" rx="18" fill="#0B1220"/>

    <!-- Chip outline -->
    <rect x="28" y="28" width="64" height="64" rx="12"
          fill="none" stroke="#E6EAF2" stroke-width="4"/>

    <!-- Pins top/bottom -->
    <g fill="#E6EAF2">
        <rect x="36" y="20" width="8" height="10" rx="2"/>
        <rect x="50" y="20" width="8" height="10" rx="2"/>
        <rect x="64" y="20" width="8" height="10" rx="2"/>
        <rect x="78" y="20" width="8" height="10" rx="2"/>

        <rect x="36" y="90" width="8" height="10" rx="2"/>
        <rect x="50" y="90" width="8" height="10" rx="2"/>
        <rect x="64" y="90" width="8" height="10" rx="2"/>
        <rect x="78" y="90" width="8" height="10" rx="2"/>
    </g>

    <!-- Pins left/right -->
    <g fill="#E6EAF2">
        <rect x="20" y="36" width="10" height="8" rx="2"/>
        <rect x="20" y="50" width="10" height="8" rx="2"/>
        <rect x="20" y="64" width="10" height="8" rx="2"/>
        <rect x="20" y="78" width="10" height="8" rx="2"/>

        <rect x="90" y="36" width="10" height="8" rx="2"/>
        <rect x="90" y="50" width="10" height="8" rx="2"/>
        <rect x="90" y="64" width="10" height="8" rx="2"/>
        <rect x="90" y="78" width="10" height="8" rx="2"/>
    </g>

    <!-- Inner tech symbol -->
    <g fill="none" stroke="#6EE7FF" stroke-width="6"
       stroke-linecap="round" stroke-linejoin="round">
        <path d="M54 44c-6 0-8 4-8 8v2c0 4-2 6-6 6
             4 0 6 2 6 6v2c0 4 2 8 8 8"/>
        <path d="M66 44c6 0 8 4 8 8v2c0 4 2 6 6 6
             -4 0 -6 2 -6 6v2c0 4-2 8-8 8"/>
    </g>

    <!-- Center node -->
    <circle cx="60" cy="60" r="5" fill="#6EE7FF"/>
</svg>
