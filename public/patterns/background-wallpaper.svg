<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
    <defs>
        <!-- Dark blue background -->
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0c1620"/>
            <stop offset="1" stop-color="#081018"/>
        </linearGradient>

        <!-- Wave pattern -->
        <pattern id="waves" width="120" height="80" patternUnits="userSpaceOnUse">
            <path d="M0 40 Q30 20 60 40 T120 40"
                  fill="none"
                  stroke="#263a4d"
                  stroke-width="1"
                  stroke-opacity="0.32"/>
        </pattern>

        <!-- Vignette -->
        <radialGradient id="vig" cx="50%" cy="50%" r="80%">
            <stop offset="0" stop-opacity="0"/>
            <stop offset="1" stop-opacity="0.6"/>
        </radialGradient>

        <!-- Star glow -->
        <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
            <feGaussianBlur stdDeviation="1.8"/>
        </filter>
    </defs>

    <!-- Base -->
    <rect width="1400" height="900" fill="url(#bg)"/>
    <rect width="1400" height="900" fill="url(#waves)"/>
    <rect width="1400" height="900" fill="url(#vig)"/>

    <!-- Stars -->
    <g filter="url(#starGlow)" opacity="0.9">
        <!-- small stars -->
        <circle cx="180" cy="130" r="1.2" fill="#ffffff"/>
        <circle cx="420" cy="260" r="0.9" fill="#ffffff" opacity="0.8"/>
        <circle cx="760" cy="180" r="1.1" fill="#ffffff"/>
        <circle cx="1020" cy="240" r="0.8" fill="#ffffff" opacity="0.75"/>
        <circle cx="1180" cy="150" r="1.3" fill="#ffffff"/>

        <circle cx="300" cy="540" r="0.9" fill="#ffffff" opacity="0.7"/>
        <circle cx="640" cy="620" r="1.1" fill="#ffffff"/>
        <circle cx="980" cy="560" r="0.85" fill="#ffffff" opacity="0.75"/>
        <circle cx="1240" cy="680" r="1.0" fill="#ffffff"/>

        <!-- slightly larger accent stars -->
        <g opacity="0.85">
            <line x1="700" y1="110" x2="716" y2="110" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
            <line x1="708" y1="102" x2="708" y2="118" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
        </g>

        <g opacity="0.85">
            <line x1="1120" y1="420" x2="1138" y2="420" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
            <line x1="1129" y1="411" x2="1129" y2="429" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
        </g>
    </g>
</svg>
